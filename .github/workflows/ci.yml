name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15 # Apple Silicon; libghostty-spm is arm64-only.
    steps:
      - uses: actions/checkout@v4

      # Fast, IDE-free build of the SPM package — catches most breakage.
      - name: swift build
        run: swift build

      # Runs the VaktaCoreTests / VaktaIntegrationTests targets.
      - name: swift test
        run: swift test

      # Table-driven/shell-integration cases for the release workflow's
      # version derivation, signing-secret validation, and local install
      # staging -- real subprocess invocations, synthetic env vars, and
      # temporary directories only; never real credentials or /Applications.
      - name: Release script tests
        run: |
          for t in Tests/scripts/test_*.sh; do
            echo "== $t =="
            bash "$t"
          done

      # Verify the app target itself generates and compiles.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app (ad-hoc)
        run: |
          xcodebuild -project Vakta.xcodeproj -scheme Vakta -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build build
